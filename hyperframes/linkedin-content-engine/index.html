<!doctype html>
<html
  lang="en"
  data-resolution="landscape"
  data-composition-variables='[{"id":"lang","type":"string","label":"Locale (en | he)","default":"en"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script
      src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"
      integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2"
      crossorigin="anonymous"
    ></script>
    <style>
      /* ============================================================
         "The Content Engine" — the content engine included in the
         Managed AI Office (/offers/ai-office-assistant#content).
         A managed pipeline runs: your material enters, angles are
         proposed, drafts are written in your voice, everything waits in
         one review queue, NOTHING publishes without your approval — one
         item is approved, the rest keep waiting — and approved posts go
         out on a steady rhythm. Horizontal conveyor; the copper "Your
         approval" checkpoint is the rack-focus peak. Schematic (no product
         UI, no "Sample data" chip). One composition, two locales (`lang`;
         HE mirrors RTL). Palette mirrors src/app/globals.css. FILM SPEC v2:
         sans only on frame (Instrument Sans EN / Assistant HE / Geist Mono
         for the Latin chips only) and the composition fills ~80% of the
         frame. Renders transparent. Settled cinematic grammar:
         velocity-matched hand-offs, one rack-focus onto the checkpoint,
         loop-continuous camera (drift <= 1.5%). NO WebGL bloom
         (flagship-only signature). See DESIGN.md.
         ============================================================ */
      @font-face { font-family: "Instrument Sans"; font-weight: 400 600; font-display: block; src: url("assets/fonts/instrument-sans-400-600-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: "Assistant"; font-weight: 600; font-display: block; src: url("assets/fonts/assistant-600-hebrew.woff2") format("woff2"); unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
      @font-face { font-family: "Assistant"; font-weight: 600; font-display: block; src: url("assets/fonts/assistant-600-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: "Assistant"; font-weight: 700; font-display: block; src: url("assets/fonts/assistant-700-hebrew.woff2") format("woff2"); unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
      @font-face { font-family: "Assistant"; font-weight: 700; font-display: block; src: url("assets/fonts/assistant-700-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: "Geist Mono"; font-weight: 400; font-display: block; src: url("assets/fonts/geist-mono-400.woff2") format("woff2"); }

      :root {
        --bg-0: #121211; --bg-1: #1a1a18; --bg-2: #242420;
        --fg-1: #f4f1ea; --fg-2: #b9b3aa; --fg-3: #8a847a;
        --accent: #d96832;
        --accent-soft: rgba(217, 104, 50, 0.12); --accent-rule: rgba(217, 104, 50, 0.35);
        --rule: #2a2a26; --rule-strong: #3a3a34;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden; background: transparent;
        font-family: "Instrument Sans", system-ui, sans-serif;
        color: var(--fg-1); -webkit-font-smoothing: antialiased;
      }
      #stage { position: relative; width: 1920px; height: 1080px; }
      #stage.he { font-family: "Assistant", system-ui, sans-serif; }
      #camera { position: absolute; inset: 0; transform-origin: 960px 540px; will-change: transform; }
      /* REVIEW/CHECK/SNAPSHOT ONLY — charcoal backdrop so contrast reads true.
         Hidden (data-hidden) before the transparent alpha render; the charcoal
         MP4 is post-composited from the alpha master — see DESIGN.md → Render.
         inset:-40px so camera drift never exposes a transparent edge. */
      #review-bg { position: absolute; inset: -40px; background: var(--bg-0); }

      /* ---------- Type roles (spec v2 — sans only). Hebrew: never mono, never tracked. ---------- */
      .mono { font-family: "Geist Mono", ui-monospace, monospace; letter-spacing: 0.02em; }
      .he .mono { font-family: "Assistant", system-ui, sans-serif; font-weight: 600; letter-spacing: 0; }
      [dir="rtl"] { letter-spacing: 0; }

      /* ---------- Source chips (your material: writing · calls · positions) ---------- */
      .frag { position: absolute; opacity: 0; will-change: transform, opacity, filter; }
      .frag-inner {
        display: inline-block; padding: 30px 56px; border-radius: 22px;
        background: var(--bg-2); border: 2.5px solid #45433c;
        font-size: 80px; line-height: 1.15; color: var(--fg-2); white-space: nowrap;
        will-change: transform;
      }
      .he .frag-inner { font-size: 88px; }

      /* ---------- Conveyor rail + nodes ---------- */
      #rail-svg { position: absolute; inset: 0; width: 1920px; height: 1080px; will-change: filter; }
      #rail { fill: none; stroke: var(--rule-strong); stroke-width: 4; }
      .node {
        position: absolute; width: 40px; height: 40px; border-radius: 50%;
        border: 3.5px solid #55524a; background: var(--bg-1);
        transform: translate(-50%, -50%); opacity: 0; will-change: transform, opacity, filter;
      }
      #n4 { border-color: var(--accent-rule); } /* approval — copper from birth */

      /* ---------- Approval checkpoint ring (node 4) — painted beneath the cards ---------- */
      #appr-ring {
        position: absolute; width: 164px; height: 164px; border-radius: 50%;
        border: 3.5px solid var(--accent); transform: translate(-50%, -50%); opacity: 0;
        will-change: transform, opacity;
      }

      /* ---------- Review queue (a deck of abstract drafts above node 3 — dot + blank bars, no text) ---------- */
      /* Opaque fill (the old 0.62-alpha fill blended over #121211): the deck overlaps, so a
         translucent card would show the card behind it through its face. */
      .qcard {
        position: absolute; width: 560px; height: 150px; border-radius: 24px;
        background: #1d1d1b; border: 2.5px solid #45433c;
        opacity: 0; display: flex; align-items: center; gap: 32px; padding: 0 40px;
        will-change: transform, opacity, filter;
      }
      #qc1 { width: 516px; } /* the deck recedes: each card behind is narrower */
      #qc2 { width: 472px; }
      .he .qcard { flex-direction: row-reverse; }
      .qdot { width: 44px; height: 44px; border-radius: 50%; border: 4px solid #55524a; flex: 0 0 auto; }
      .qbars { display: flex; flex-direction: column; gap: 20px; flex: 1 1 auto; }
      .he .qbars { align-items: flex-end; }
      .qbar { width: 100%; height: 14px; border-radius: 7px; background: #4a473f; } /* explicit width: HE aligns bars flex-end, which would collapse an auto-width bar to 0 */
      .qbar.mid { width: 78%; }
      .qbar.short { width: 52%; }
      /* the human check — on the approved draft (qc0) */
      #appr-check { width: 80px; height: 80px; flex: 0 0 auto; opacity: 0; }
      #appr-check path {
        fill: none; stroke: var(--accent); stroke-width: 5; stroke-linecap: round;
        stroke-linejoin: round; stroke-dasharray: 48; stroke-dashoffset: 48;
      }

      /* the traveling token — centered via GSAP xPercent/yPercent (NOT a CSS
         translate) because the timeline animates x along the rail, which would
         otherwise overwrite a CSS transform and drop the centering offset. */
      #token {
        position: absolute; width: 48px; height: 48px; border-radius: 13px;
        background: var(--accent); box-shadow: 0 0 34px 0 rgba(217,104,50,0.35);
        opacity: 0; will-change: transform, opacity;
      }

      /* ---------- Published rhythm (even copper beats below the out end of the rail) ---------- */
      .beat {
        position: absolute; width: 40px; height: 40px; border-radius: 50%;
        background: var(--accent); transform: translate(-50%, -50%); opacity: 0;
        will-change: transform, opacity;
      }

      /* ---------- Stage headlines (one at a time, one centred band; lbl5 held as the closing) ---------- */
      .lbl {
        position: absolute; left: 0; top: 200px; width: 1920px; text-align: center;
        font-family: "Instrument Sans", system-ui, sans-serif; font-weight: 600;
        font-size: 128px; line-height: 1.1; letter-spacing: -0.01em; color: var(--fg-1);
        opacity: 0; white-space: nowrap; will-change: transform, opacity, filter;
      }
      .he .lbl { font-family: "Assistant", system-ui, sans-serif; font-weight: 700; font-size: 140px; letter-spacing: 0; }

      /* ---------- Caption (the one secondary line — the safety line at the peak) ---------- */
      #caption {
        position: absolute; left: 0; top: 920px; width: 1920px; text-align: center;
        font-family: "Instrument Sans", system-ui, sans-serif; font-weight: 400;
        font-size: 72px; line-height: 1.2; letter-spacing: 0; color: var(--fg-2); opacity: 0;
        will-change: transform, opacity, filter;
      }
      .he #caption { font-family: "Assistant", system-ui, sans-serif; font-weight: 600; font-size: 80px; letter-spacing: 0; }
    </style>
  </head>

  <body>
    <div id="stage" data-composition-id="root" data-start="0" data-duration="13" data-width="1920" data-height="1080">
      <div id="camera" data-layout-allow-overflow>
        <div id="review-bg"></div>

        <!-- conveyor rail -->
        <svg id="rail-svg" viewBox="0 0 1920 1080">
          <line id="rail" x1="185" y1="640" x2="1735" y2="640" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" />
        </svg>

        <!-- source chips (your material) -->
        <div class="frag" id="frag1"><span class="frag-inner mono" id="fragt1"></span></div>
        <div class="frag" id="frag2"><span class="frag-inner mono" id="fragt2"></span></div>
        <div class="frag" id="frag3"><span class="frag-inner mono" id="fragt3"></span></div>

        <!-- node dots -->
        <div class="node" id="n0"></div>
        <div class="node" id="n1"></div>
        <div class="node" id="n2"></div>
        <div class="node" id="n3"></div>
        <div class="node" id="n4"></div>
        <div class="node" id="n5"></div>

        <!-- approval ring (node 4) — beneath the cards so it emanates from behind them -->
        <div id="appr-ring"></div>

        <!-- review queue: a deck above node 3, back to front (qc0 = the front draft, the one approved) -->
        <div class="qcard" id="qc2"><span class="qdot"></span><span class="qbars"><span class="qbar"></span><span class="qbar mid"></span><span class="qbar short"></span></span></div>
        <div class="qcard" id="qc1"><span class="qdot"></span><span class="qbars"><span class="qbar"></span><span class="qbar mid"></span><span class="qbar short"></span></span></div>
        <div class="qcard" id="qc0">
          <span class="qdot"></span>
          <span class="qbars"><span class="qbar"></span><span class="qbar mid"></span><span class="qbar short"></span></span>
          <svg id="appr-check" viewBox="0 0 46 46"><path d="M11 24 l8 8 l16 -19" /></svg>
        </div>

        <!-- the traveling token -->
        <div id="token"></div>

        <!-- published rhythm (below the out end of the rail) -->
        <div class="beat" id="b0"></div>
        <div class="beat" id="b1"></div>
        <div class="beat" id="b2"></div>
        <div class="beat" id="b3"></div>

        <!-- stage headlines (one at a time; lbl5 = the out node, held as the closing) -->
        <div class="lbl" id="lbl0"></div>
        <div class="lbl" id="lbl1"></div>
        <div class="lbl" id="lbl2"></div>
        <div class="lbl" id="lbl3"></div>
        <div class="lbl" id="lbl4"></div>
        <div class="lbl" id="lbl5"></div>

        <!-- the one secondary line -->
        <div id="caption"></div>
      </div>
    </div>

    <script>
      /* ============================================================
         Deterministic 13s timeline. No random / Date / setTimeout /
         async / timeline callbacks (all text set once at init). The
         `lang` variable picks copy + mirrors the horizontal axis for HE.
         Every on-frame string traces to the `included` section of
         src/content/offers/ai-office-assistant.ts (line refs below; full
         trace table in DESIGN.md).
         ============================================================ */
      const vars = (window.__hyperframes && window.__hyperframes.getVariables)
        ? window.__hyperframes.getVariables() : {};
      const lang = vars.lang === "he" ? "he" : "en";

      const COPY = {
        en: {
          frag: ["writing", "calls", "positions"],   // included.items[0].desc "…your existing writing, calls, and positions" (:159)
          l0: "Your material",                        // included.film.caption "Your material becomes drafts…" (:185)
          l1: "Angles proposed",                      // included.intro "angles proposed from your real material" (:155)
          l2: "Drafts in your voice",                 // included.film.caption "…drafts in your voice…" (:185)
          l3: "Review queue",                         // included.items[2].title "One review queue" (:166)
          l4: "Your approval",                        // included.intro "…without your approval" (:155)
          l5: "Published on rhythm",                  // included.items[3].title "Publishing rhythm" (:170) — held as the closing
          caption: "Nothing publishes without your approval", // included.film.caption "…nothing publishes without your approval" (:185)
        },
        he: {
          frag: ["כתיבה", "שיחות", "עמדות"],         // he included.items[0].desc "נבנה מהכתיבה, השיחות והעמדות…" (:400)
          l0: "החומר שלכם",                           // he included.film.caption "החומר שלכם הופך…" (:424)
          l1: "זוויות מוצעות",                        // he included.intro "זוויות שמוצעות מהחומר האמיתי שלכם" (:396)
          l2: "טיוטות בקול שלכם",                     // he included.intro "טיוטות בקול שלכם" (:396)
          l3: "תור אישורים",                          // he included.items[2].title "תור אישורים אחד" (:407)
          l4: "האישור שלכם",                          // he included.intro "…בלי אישור שלכם" (:396)
          l5: "מתפרסם בקצב",                          // he included.items[3].title "קצב פרסום" (:411) — held as the closing
          caption: "שום דבר לא מתפרסם בלי אישור שלכם", // he included.film.caption "…ושום דבר לא מתפרסם בלי אישור שלכם" (:424)
        },
      }[lang];

      document.documentElement.lang = lang;
      // Do NOT set dir="rtl" on <html> — it blanks the hyperframes RENDER
      // pipeline. Mirror positionally via X(); set dir only on text elements.
      const isHE = lang === "he";
      if (isHE) {
        document.getElementById("stage").classList.add("he");
        document.querySelectorAll(".lbl, .frag-inner, #caption").forEach((el) => { el.dir = "rtl"; });
      }

      const setText = (id, t) => { document.getElementById(id).textContent = t; };
      COPY.frag.forEach((t, i) => setText("fragt" + (i + 1), t));
      ["l0", "l1", "l2", "l3", "l4", "l5"].forEach((k, i) => setText("lbl" + i, COPY[k]));
      setText("caption", COPY.caption);

      // ---- Geometry (EN coordinates; HE mirrors x → 1920 − x) — spec v2 ----
      // Rail x 185 → 1735 (1550px), headline band top 200, rail y 640, the
      // review-queue deck above node 3, the approved draft below node 4, the
      // published rhythm below the out end, caption top 920.
      const X = isHE ? (x) => 1920 - x : (x) => x;
      const RAIL_Y = 640, RAIL_X0 = 185, RAIL_X1 = 1735;
      const NX = [245, 531, 817, 1103, 1389, 1675]; // node x, EN (gap 286)
      const place = (id, cx, cy) => {
        const el = document.getElementById(id);
        el.style.left = X(cx) + "px";
        el.style.top = cy + "px";
      };

      // rail endpoints mirror with the nodes (else HE nodes float past the fixed rail)
      const railLine = document.getElementById("rail");
      railLine.setAttribute("x1", X(RAIL_X0)); railLine.setAttribute("x2", X(RAIL_X1));
      NX.forEach((x, i) => place("n" + i, x, RAIL_Y));

      // source chips — a loose pile above the head of the rail; centred via GSAP so the merge flight composes
      const FRAGS = [[470, 290], [1000, 410], [520, 530]];
      FRAGS.forEach(([cx, cy], i) => place("frag" + (i + 1), cx, cy));
      gsap.set(".frag", { xPercent: -50, yPercent: -50 });
      gsap.set("#frag1 .frag-inner", { rotation: -6 });
      gsap.set("#frag2 .frag-inner", { rotation: 4 });
      gsap.set("#frag3 .frag-inner", { rotation: -3 });

      // token starts at node 0 (centered via GSAP so x-travel composes cleanly)
      place("token", NX[0], RAIL_Y);
      gsap.set("#token", { xPercent: -50, yPercent: -50 });

      // review queue — a deck centred over node 3: the front draft's bottom sits 50px
      // above the rail; each card behind shows a 30px lip above the one in front (≤ the
      // 34px inset of a card's bars, so no bar of a card behind peeks over the edge).
      const CARD_H = 150, DECK_LIP = 30, Q_TOP = [440, 440 - DECK_LIP, 440 - 2 * DECK_LIP];
      Q_TOP.forEach((top, i) => place("qc" + i, NX[3], top));
      gsap.set(".qcard", { xPercent: -50 });
      // the approved draft passes the checkpoint and lands BELOW the rail under node 4
      const APPR_TOP = 690;

      // approval ring on node 4
      place("appr-ring", NX[4], RAIL_Y);

      // published rhythm — four even beats below the out end, the last under node 5
      const BEAT_Y = APPR_TOP + CARD_H / 2; // where the approved draft sat
      const BX = [1231, 1379, 1527, 1675];  // pitch 148 (2× the v1 pitch)
      BX.forEach((x, i) => place("b" + i, x, BEAT_Y));

      // travel helper: x-delta from node a to node b (HE-aware)
      const dx = (a, b) => X(NX[b]) - X(NX[a]);

      // ---- Timeline ----
      // Settled grammar: velocity-matched hand-offs (exits accelerate + blur,
      // entries decelerate from blur), a rack focus onto the copper approval
      // checkpoint at the peak, and a loop-continuous camera (identity at t=0
      // and t=13). The rack refocuses before the tail so the seam is crisp.
      // Offsets/blurs scaled with the v2 element sizes (grammar unchanged).
      const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out", overwrite: "auto" } });

      const showLabel = (id, at) =>
        tl.fromTo("#" + id, { opacity: 0, y: 24, filter: "blur(14px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "power2.out" }, at);
      const hideLabel = (id, at) =>
        tl.to("#" + id, { opacity: 0, y: -18, filter: "blur(14px)", duration: 0.45, ease: "power2.in" }, at);
      const nodeIn = (i, at) =>
        tl.fromTo("#n" + i, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5 }, at);
      // node activation (copper) as the token arrives
      const activate = (i, at) =>
        tl.to("#n" + i, { borderColor: "#d96832", backgroundColor: "rgba(217,104,50,0.14)", scale: 1.18, duration: 0.4, ease: "power2.out" }, at);
      const tokenTo = (i, at) =>
        tl.to("#token", { x: dx(0, i), duration: 0.7, ease: "power2.inOut" }, at);

      // ===== BEAT 0 — Material arrives (0.0–2.0) =====
      // autoRound:false — pathLength=1 makes the offset a 1→0 fraction; CSSPlugin's
      // default px rounding would snap it (the rail would pop on at ~1.0s, not draw).
      tl.to("#rail", { strokeDashoffset: 0, duration: 1.6, ease: "power1.inOut", autoRound: false }, 0.1);
      FRAGS.forEach((_, i) =>
        tl.fromTo("#frag" + (i + 1), { opacity: 0, y: 36, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "power2.out" }, 0.2 + i * 0.16));
      nodeIn(0, 1.0);
      // chips accelerate into node 0 + blur out (velocity-matched exit) → token appears
      FRAGS.forEach(([cx, cy], i) =>
        tl.to("#frag" + (i + 1), { x: X(NX[0]) - X(cx), y: RAIL_Y - cy, scale: 0.4, opacity: 0, filter: "blur(16px)", duration: 0.5, ease: "power2.in" }, 1.15 + i * 0.07));
      tl.fromTo("#token", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power2.out" }, 1.5);
      activate(0, 1.5);
      showLabel("lbl0", 1.4);

      // ===== BEAT 1 — Angles → drafts (2.0–4.2) =====
      hideLabel("lbl0", 2.15);
      tokenTo(1, 2.35); nodeIn(1, 2.4);
      activate(1, 2.9); showLabel("lbl1", 2.55);
      hideLabel("lbl1", 3.3);
      tokenTo(2, 3.5); nodeIn(2, 3.55);
      activate(2, 4.05); showLabel("lbl2", 3.7);

      // ===== BEAT 2 — Review queue (4.2–6.8) =====
      hideLabel("lbl2", 4.55);
      tokenTo(3, 4.75); nodeIn(3, 4.8);
      activate(3, 5.3); showLabel("lbl3", 4.95);
      // the deck assembles back to front (cards decelerate from blur)
      const qIn = (id, at) =>
        tl.fromTo("#" + id, { opacity: 0, y: 30, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power2.out" }, at);
      qIn("qc2", 5.4); qIn("qc1", 5.56); qIn("qc0", 5.72);

      // ===== BEAT 3 — PEAK: your approval (6.8–9.3) =====
      hideLabel("lbl3", 6.75);
      tokenTo(4, 6.9); nodeIn(4, 6.95);
      showLabel("lbl4", 7.15);
      // the front draft leaves the queue, passes the checkpoint and lands below node 4
      tl.to("#qc0", { x: dx(3, 4), duration: 0.7, ease: "power2.inOut" }, 7.0);
      tl.to("#qc0", { y: APPR_TOP - Q_TOP[0], duration: 0.7, ease: "power2.inOut" }, 7.1);
      // the rest of the queue advances one slot — still waiting
      tl.to(["#qc1", "#qc2"], { y: DECK_LIP, duration: 0.5, ease: "power2.inOut" }, 7.3);
      // RACK FOCUS — upstream (rail, nodes 0–3) defocus + dim; the waiting queue takes a
      // shallower defocus so "still waiting" reads beside the approved draft; the copper
      // checkpoint, the approved draft and the token stay sharp. Camera pushes in (below).
      // The waiting cards dim by brightness(), NOT opacity: they overlap, and a
      // translucent card shows the card behind it through its face.
      const UPSTREAM = ["#rail-svg", "#n0", "#n1", "#n2", "#n3"];
      const WAITING = ["#qc1", "#qc2"];
      tl.to(UPSTREAM, { filter: "blur(9px)", opacity: 0.4, duration: 0.75, ease: "power2.inOut" }, 7.5);
      tl.fromTo(WAITING, { filter: "blur(0px) brightness(1)" },
        { filter: "blur(4px) brightness(0.7)", duration: 0.75, ease: "power2.inOut", immediateRender: false }, 7.5);
      tl.to("#n4", { boxShadow: "0 0 60px 0 rgba(217,104,50,0.4)", borderColor: "#d96832", backgroundColor: "rgba(217,104,50,0.2)", scale: 1.25, duration: 0.6 }, 7.55);
      // one bounded copper ring bloom (immediateRender:false so the "from" state
      // does not paint from t=0)
      tl.fromTo("#appr-ring", { opacity: 0.9, scale: 0.5, transformOrigin: "center" },
        { opacity: 0, scale: 1.9, duration: 1.1, ease: "power2.out", immediateRender: false }, 7.7);
      // the draft is approved by a person — it warms to copper and the check draws in
      // (opaque copper tint = 12% copper over the card fill, so the alpha master stays clean)
      tl.to("#qc0", { borderColor: "#d96832", backgroundColor: "#34261e", duration: 0.4 }, 8.3);
      tl.to("#qc0 .qdot", { borderColor: "#d96832", backgroundColor: "#d96832", duration: 0.4 }, 8.3);
      tl.to("#appr-check", { opacity: 1, duration: 0.2 }, 8.4);
      tl.to("#appr-check path", { strokeDashoffset: 0, duration: 0.55, ease: "power2.inOut" }, 8.45);
      // the safety line appears verbatim (decelerate from blur)
      tl.fromTo("#caption", { opacity: 0, y: 18, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "power2.out" }, 8.5);

      // ===== BEAT 4 — Published on rhythm (9.3–11.0) =====
      // REFOCUS — the rack releases so the loop seam is crisp.
      tl.to(UPSTREAM, { filter: "blur(0px)", opacity: 1, duration: 0.8, ease: "power2.inOut" }, 9.35);
      tl.to(WAITING, { filter: "blur(0px) brightness(1)", duration: 0.8, ease: "power2.inOut" }, 9.35);
      tl.to("#n4", { boxShadow: "0 0 40px 0 rgba(217,104,50,0.18)", duration: 0.8, ease: "power2.inOut" }, 9.35);
      hideLabel("lbl4", 9.4);
      // the token and the approved draft go out to node 5 (the draft dissolves into it)
      tokenTo(5, 9.55); nodeIn(5, 9.6);
      tl.to("#qc0", { x: dx(3, 5), y: RAIL_Y - CARD_H / 2 - Q_TOP[0], scale: 0.35, opacity: 0, filter: "blur(14px)", duration: 0.6, ease: "power2.in" }, 9.55);
      activate(5, 10.05); showLabel("lbl5", 9.75); // the out node — held through the tail as the closing
      // published beats land at even intervals (rhythm) — even x, even time
      const beatIn = (id, at) =>
        tl.fromTo("#" + id, { opacity: 0, scale: 0.3 }, { opacity: 0.92, scale: 1, duration: 0.32, ease: "power2.out" }, at);
      beatIn("b0", 10.1); beatIn("b1", 10.34); beatIn("b2", 10.58); beatIn("b3", 10.82);

      // ===== BEAT 5 — Settle (11.0–13.0) =====
      tl.to("#caption", { opacity: 0, y: -18, filter: "blur(12px)", duration: 0.5, ease: "power2.in" }, 11.0);
      // the rhythm holds softly (finite gentle pulse — never repeat:-1). Timed to
      // COMPLETE before t=13: last beat starts 11.5 + 0.05·3 = 11.65 and its two
      // 0.5s yoyo halves end at 12.65, so every beat settles back to rest (0.92)
      // before the seam — nothing frozen mid-yoyo at the loop point.
      tl.to(".beat", { opacity: 0.7, duration: 0.5, ease: "sine.inOut", repeat: 1, yoyo: true, stagger: 0.05 }, 11.5);

      // ===== CAMERA — loop-continuous (identity at t=0 AND t=13), drift ≤ 1.5% =====
      // Push gently INTO the approval peak (scale 1.0 → 1.015), hold, then settle
      // back so the seam matches. Micro-drift overlays: integer sine cycles on both
      // axes (1× X, 2× Y) so dx,dy return to 0 at the seam; the 2:1 ratio avoids a
      // mechanical diagonal. scale AND drift are pure functions of timeline time —
      // no reads of a sibling tween — so every seek/worker is identical.
      const camEl = document.getElementById("camera");
      const DUR = 13, PUSH = 0.015, DRIFT_AMP_X = 5, DRIFT_AMP_Y = 3;
      const camEase = gsap.parseEase("power2.inOut");
      const scaleAt = (t) => {
        if (t <= 5.8) return 1.0;
        if (t < 8.0) return 1.0 + PUSH * camEase((t - 5.8) / 2.2);
        if (t <= 9.6) return 1.0 + PUSH;
        if (t < 12.5) return 1.0 + PUSH - PUSH * camEase((t - 9.6) / 2.9);
        return 1.0;
      };
      const drift = { p: 0 };
      tl.to(drift, {
        p: 1, duration: DUR, ease: "none",
        onUpdate: () => {
          const t = drift.p * DUR;
          const ddx = Math.sin(drift.p * Math.PI * 2) * DRIFT_AMP_X;
          const ddy = Math.sin(drift.p * Math.PI * 4) * DRIFT_AMP_Y;
          camEl.style.transform = `scale(${scaleAt(t)}) translate(${ddx}px, ${ddy}px)`;
        },
      }, 0);

      window.__timelines = window.__timelines || {};
      window.__timelines["root"] = tl;
    </script>
  </body>
</html>
